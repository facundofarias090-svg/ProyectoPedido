<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link rel="stylesheet" href="../bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="stylePRODUCTO.css">
</head>
<body>

    <div class="container my-4">
        <h2 class="mb-4">Gestion Producto</h2>
<!-- registrar producto -->
        <form id="form-producto" class="row g-3 mb-4">
            <div class="col-md-3">
                <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="col-md-3">
                <input type="text" id="descripcion" class="form-control" placeholder="Descripción" required>
            </div>
            <div class="col-md-2">
                <input type="text" id="precioCosto" class="form-control" placeholder="Precio costo" required>
            </div>
            <div class="col-md-2">
                <input type="text" id="precioVenta" class="form-control" placeholder="Precio venta" required>
            </div>
            <div class="col-md-1">
                <input type="number" id="stock" class="form-control" placeholder="Stock" min="0" required>
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>


<!-- modal -->
        <div class="modal fade" id="modal-editar-producto" tabindex="-1" aria-labelledby="modal-editar-producto-label" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="form-editar-producto">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modal-editar-producto-label">Editar producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="editar-nombre" class="form-label">Nombre</label>
                                <input type="text" id="editar-nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="editar-descripcion" class="form-label">Descripción</label>
                                <input type="text" id="editar-descripcion" class="form-control" required>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="editar-precioCosto" class="form-label">Precio costo</label>
                                    <input type="text" id="editar-precioCosto" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="editar-precioVenta" class="form-label">Precio venta</label>
                                    <input type="text" id="editar-precioVenta" class="form-control" required>
                                </div>
                            </div>
                            <div class="mt-3">
                                <label for="editar-stock" class="form-label">Stock</label>
                                <input type="number" id="editar-stock" class="form-control" min="0" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>


    <p>Tabla productos</p>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">PrecioCosto</th>
                    <th scope="col">PrecioVenta</th>
                    <th scope="col">Stock</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos" class="table-group-divider"></tbody>
        </table>
    </div>

    

<script src="../js/Producto 1.0.0.js"></script>
<script src="../bootstrap/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

</body>
</html>
